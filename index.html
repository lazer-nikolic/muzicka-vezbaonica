<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Woodshed — Scale &amp; Chord Practice Quiz | Vežbaonica</title>
<meta name="description" content="Free interactive quiz for practicing musical scales and chords — identify notes in a scale, a chord, or by scale degree. Available in English and Serbian. Besplatan kviz za vežbanje skala i akorda — muzička vežbaonica na srpskom i engleskom.">
<meta name="keywords" content="music practice, scale practice, chord practice, music theory quiz, ear training, vežbanje skala, vežbanje akorda, muzička vežbaonica, teorija muzike, kviz iz muzike">
<link rel="canonical" href="https://lazer-nikolic.github.io/muzicka-vezbaonica/">

<meta property="og:type" content="website">
<meta property="og:title" content="The Woodshed — Scale & Chord Practice Quiz | Vežbaonica">
<meta property="og:description" content="Free interactive quiz for practicing musical scales and chords, in English or Serbian.">
<meta property="og:url" content="https://lazer-nikolic.github.io/muzicka-vezbaonica/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="The Woodshed — Scale & Chord Practice Quiz | Vežbaonica">
<meta name="twitter:description" content="Free interactive quiz for practicing musical scales and chords, in English or Serbian.">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "The Woodshed",
  "alternateName": "Vežbaonica",
  "description": "Interactive scale and chord practice quiz for musicians. Practice identifying notes in a scale, a chord, or by scale degree. Available in English and Serbian.",
  "applicationCategory": "EducationalApplication",
  "operatingSystem": "Any (web browser)",
  "inLanguage": ["en", "sr"],
  "isAccessibleForFree": true,
  "url": "https://lazer-nikolic.github.io/muzicka-vezbaonica/"
}
</script>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='rgb(22,33,27)'/><text x='50' y='78' font-family='Georgia,serif' font-size='82' font-weight='700' text-anchor='middle' fill='rgb(205,164,58)'>𝄞</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div id="app" x-data="quizApp()" x-cloak>

  <div class="top-bar">
    <button type="button" class="btn btn-ghost" id="goBackBtn" x-show="screen === 'quiz'" @click="goBack()">← <span x-text="t('GO_BACK_BTN')"></span></button>
    <div class="lang-switch">
      <button type="button" class="lang-btn" :class="{ active: lang === 'en' }" @click="setLocale('en')">EN</button>
      <button type="button" class="lang-btn" :class="{ active: lang === 'sr' }" @click="setLocale('sr')">SR</button>
    </div>
  </div>

  <div class="staff-header">
    <div class="staff-wrap"><svg viewBox="0 0 700 90" preserveAspectRatio="xMidYMid meet" x-html="staffMarkup"></svg></div>
    <div class="title-block">
      <h1 x-text="t('APP_TITLE')">The Woodshed</h1>
      <p x-text="t('APP_SUBTITLE')">Scale &amp; chord drill</p>
    </div>
  </div>

  <!-- SETUP SCREEN -->
  <section class="panel" x-show="screen === 'setup'">
    <div class="error-msg" x-show="setupError" x-text="setupError"></div>

    <fieldset>
      <legend><span x-text="t('LEGEND_TYPES')"></span><span class="legend-sub" x-text="t('LEGEND_TYPES_SUB')"></span></legend>
      <div class="check-grid">
        <template x-for="k in questionTypeKeys" :key="k">
          <label class="check-item" :class="{ checked: selectedTypes.includes(k) }">
            <input type="checkbox" :value="k" x-model="selectedTypes">
            <span x-text="questionTypeLabel(k)"></span>
          </label>
        </template>
      </div>
    </fieldset>

    <fieldset>
      <legend><span x-text="t('LEGEND_INPUT')"></span><span class="legend-sub" x-text="t('LEGEND_INPUT_SUB')"></span></legend>
      <div class="check-grid">
        <label class="check-item" :class="{ checked: inputMode === 'type' }">
          <input type="radio" name="answerInput" value="type" x-model="inputMode">
          <span x-text="t('INPUT_TYPE_LABEL')"></span>
        </label>
        <label class="check-item" :class="{ checked: inputMode === 'piano' }">
          <input type="radio" name="answerInput" value="piano" x-model="inputMode">
          <span x-text="t('INPUT_PIANO_LABEL')"></span>
        </label>
      </div>
    </fieldset>

    <fieldset x-show="showChordFieldset">
      <legend><span x-text="t('LEGEND_CHORDS')"></span><span class="legend-sub" x-text="t('LEGEND_CHORDS_SUB')"></span></legend>
      <div class="check-grid">
        <template x-for="k in chordPrimary" :key="k">
          <label class="check-item" :class="{ checked: selectedChords.includes(k) }">
            <input type="checkbox" :value="k" x-model="selectedChords">
            <span x-text="chordLabel(k)"></span>
          </label>
        </template>
      </div>
      <details class="more">
        <summary x-text="t('MORE_CHORDS')"></summary>
        <div class="check-grid">
          <template x-for="k in chordMore" :key="k">
            <label class="check-item" :class="{ checked: selectedChords.includes(k) }">
              <input type="checkbox" :value="k" x-model="selectedChords">
              <span x-text="chordLabel(k)"></span>
            </label>
          </template>
        </div>
      </details>
    </fieldset>

    <fieldset x-show="showScaleFieldset">
      <legend><span x-text="t('LEGEND_SCALES')"></span><span class="legend-sub" x-text="t('LEGEND_SCALES_SUB')"></span></legend>
      <div class="check-grid">
        <template x-for="k in scalePrimary" :key="k">
          <label class="check-item" :class="{ checked: selectedScales.includes(k) }">
            <input type="checkbox" :value="k" x-model="selectedScales">
            <span x-text="scaleLabel(k)"></span>
          </label>
        </template>
      </div>
      <details class="more">
        <summary x-text="t('MORE_SCALES')"></summary>
        <div class="check-grid">
          <template x-for="k in scaleMore" :key="k">
            <label class="check-item" :class="{ checked: selectedScales.includes(k) }">
              <input type="checkbox" :value="k" x-model="selectedScales">
              <span x-text="scaleLabel(k)"></span>
            </label>
          </template>
        </div>
      </details>
    </fieldset>

    <fieldset>
      <legend x-text="t('LEGEND_LENGTH')"></legend>
      <div class="num-row">
        <input type="number" x-model.number="questionCount" min="3" max="30">
        <span style="color:var(--chalk-dim); font-size:13px;" x-text="t('LENGTH_UNIT')"></span>
      </div>
    </fieldset>

    <div class="btn-row">
      <button class="btn btn-primary" @click="startQuiz()" x-text="t('START_BTN')"></button>
    </div>
  </section>

  <!-- QUIZ SCREEN -->
  <section class="panel" x-show="screen === 'quiz'">
    <div class="quiz-meta">
      <span x-text="t('QUESTION_OF', { i: index + 1, n: questions.length })"></span>
      <span class="score" x-text="t('SCORE_LABEL') + ': ' + score"></span>
    </div>

    <p class="question-text">
      <span x-text="questionParts.text"></span>
      <span class="hint" x-show="questionParts.hint" x-text="questionParts.hint"></span>
    </p>

    <!-- Typed (note-box) input -->
    <div id="answerType" x-show="inputMode === 'type'">
      <div class="note-boxes" x-ref="noteBoxesWrap">
        <template x-for="(val, idx) in noteBoxes" :key="idx">
          <input type="text" class="note-box" :class="boxClass(idx)" maxlength="2"
                 autocomplete="off" autocapitalize="off" spellcheck="false"
                 :disabled="answered"
                 :value="val"
                 @input="onBoxInput($event, idx)"
                 @keydown="onBoxKeydown($event, idx)"
                 @focus="$event.target.select()">
        </template>
      </div>
      <div class="type-hint" x-text="t('TYPE_HINT')"></div>
      <div class="type-error" x-show="typeError" x-text="typeError"></div>
    </div>

    <div class="reveal-label" x-show="inputMode === 'type' && answered" x-text="t('REVEAL_LABEL')"></div>

    <!-- Piano keyboard: interactive input in piano mode, read-only answer reveal in typed mode -->
    <div class="keyboard" :class="{ locked: answered }" x-show="inputMode === 'piano' || answered">
      <template x-for="note in whiteNotes" :key="note">
        <div class="white-key" :class="keyClasses(note)" @click="onKeyClick(note)">
          <span x-text="displayNote(note)"></span>
        </div>
      </template>
      <template x-for="note in blackNotes" :key="note">
        <div class="black-key" :class="keyClasses(note)" :style="{ left: blackKeyLeft[note] }" @click.stop="onKeyClick(note)">
          <span x-text="displayNote(note)"></span>
        </div>
      </template>
    </div>

    <!-- Selection chips: piano mode only -->
    <div class="selection-row" x-show="inputMode === 'piano'">
      <template x-if="selectedNotesOrdered.length === 0">
        <span class="chip placeholder" x-text="t('NO_SELECTION')"></span>
      </template>
      <template x-for="n in selectedNotesOrdered" :key="n">
        <span class="chip" x-text="displayNote(n)"></span>
      </template>
    </div>

    <div x-show="answered">
      <div class="feedback" :class="lastCorrect ? 'correct' : 'wrong'">
        <b x-text="feedbackPrefix"></b> <span x-text="feedbackRest"></span>
        <span class="spelling-note" x-show="spellingNoteText" x-text="spellingNoteText"></span>
      </div>
    </div>

    <div class="quiz-actions">
      <button class="btn btn-ghost" x-show="!answered" @click="clearAnswer()" x-text="t('CLEAR_BTN')"></button>
      <button class="btn btn-primary" x-ref="submitBtn" :disabled="!canSubmit" @click="handleSubmitClick()" x-text="submitLabel"></button>
    </div>
  </section>

  <!-- RESULTS SCREEN -->
  <section class="panel" x-show="screen === 'results'">
    <div class="score-hero">
      <div class="big" x-text="score + '/' + questions.length"></div>
      <div class="sub" x-text="t('RESULTS_SUB', { pct: resultsPct })"></div>
    </div>
    <div class="review-list">
      <template x-for="(q, i) in questions" :key="i">
        <div class="review-item" :class="results[i] ? 'is-correct' : 'is-wrong'">
          <div class="review-row" role="button" tabindex="0" :aria-expanded="resultsExpanded[i]"
               @click="toggleResultRow(i)" @keydown.enter="toggleResultRow(i)" @keydown.space.prevent="toggleResultRow(i)">
            <span class="q" x-text="sentenceFor(q)"></span>
            <svg class="chevron" :class="{ expanded: resultsExpanded[i] }" viewBox="0 0 24 24" width="16" height="16"
                 fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
          <div class="review-detail" x-show="resultsExpanded[i]">
            <table class="detail-table">
              <tr>
                <td class="detail-label" x-text="t('YOUR_ANSWER')"></td>
                <td>
                  <div class="detail-chips">
                    <template x-if="reviewUserNotes(i).length === 0">
                      <span class="detail-empty" x-text="t('NO_SELECTION')"></span>
                    </template>
                    <template x-for="n in reviewUserNotes(i)" :key="n.note">
                      <span class="detail-chip" :class="n.status" x-text="displayNote(n.note)"></span>
                    </template>
                  </div>
                </td>
              </tr>
              <tr>
                <td class="detail-label" x-text="t('CORRECT_ANSWER')"></td>
                <td>
                  <div class="detail-chips">
                    <template x-for="n in reviewCorrectNotes(i)" :key="n.note">
                      <span class="detail-chip" :class="n.status" x-text="displayNote(n.note)"></span>
                    </template>
                  </div>
                </td>
              </tr>
            </table>
          </div>
        </div>
      </template>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" @click="retry()" x-text="t('RETRY_BTN')"></button>
      <button class="btn btn-primary" @click="newQuiz()" x-text="t('NEW_QUIZ_BTN')"></button>
    </div>
  </section>

  <footer x-text="t('FOOTER_NOTE')">Notes are spelled with sharps only, to keep things simple.</footer>
</div>

<script src="alpine.min.js" defer></script>
<script src="localization.js?v=4"></script>
<script src="index.js?v=4"></script>
</body>
</html>
